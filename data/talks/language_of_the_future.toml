[[slides]]
concents = [
    "Light spectrum with ranges (ultraviolet, visible, infrared)"
]
speech = """
Представьте: вы сидите дома, и в доме жарко.
Что делать?
Можно спросить ChatGPT.
Я спросил, и она предложила повесить пленки на окна (специальные светопоглощающие пленки).
Я спросил, какие пленки лучше выбрать.
Она сказала, что лучше выбрать пленку с высоким коэффициентом поглощения не только в видимом, но и в инфракрасном спектре.
Оказалось, что более 50% солнечной энергии приходится на инфракрасный диапазон.
При этом маркетинговые материалы указывают коэффициент поглощения в ультрафиолетовом диапазоне на самом видном месте.
Нельзя сказать, что они врут... просто они структурируют информацию таким образом, что "большое число" стоит в начале, а то число, которое вам на самом деле важно, оно стоит в конце или вообще не указано.
Этот пример показывает, насколько важно иметь точную модель реальности, которая говорит о том, что коэффициент поглощения в инфракрасном спектре важнее, чем в ультрафиолетовом.
"""

