speech = """
Язык - это именно то, что отличает нас, людей, от животных.
У них тоже есть свои языки, но они гораздо примитивнее.
Возникает вопрос: если есть примитивные животные языки, есть более продвинутые человеческие языки, то может, существуют еще более продвинутые языки (языки инопланетян)?
И, да, такие языки действительно существуют.
Один из таких языков мы сегодня увидим.
"""

[[slides]]
title = "Baselang"
