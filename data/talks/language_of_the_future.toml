]
speech = """
Язык называется "Baselang".
Он отличается от естественных человеческих языков тем, что автоматически находит логические противоречия.
То есть, на этом языке сложнее врать, в том числе самому себе.
У меня часто бывало такое, что я начинал выражать какую-то мысль на Baselang, и понимал, что мысль неверна.
В этот момент я говорил: "Спасибо, Baselang!"
"""

