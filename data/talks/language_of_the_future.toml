    "Кто съел сметану: дед или кот?",
]

[[slides]]
contents = [
    "Кот, который залез в крыжовник, который посадил дед, который родился в 1955-м году, съел сметану.",
]
speech = [
    "Вот эта фраза, записанная сплошным текстом.",
]

[[slides]]
contents = [
    "д = дед, который родился в 1955-м году",
    "к = крыжовник, который посадил д",
    "x = кот, который залез в к",
    "x съел сметану"
]
speech = """
А вот тот же текст, записанная с помощью переменных.
Такой текст легче читать, потому что вложенные высказывания выложены в правильном порядке.

В этом тексте есть важная деталь.
Смотрите:
- Для обозначения "деда" я использовал букву "д".
- Для обозначения "крыжовника" я использовал букву "к".
- А для обозначения кота я использовал букву "x" (это, кстати, "икс", а не "ха"), потому что буква "к" уже занята.

Это первое правило математики: использовать одну букву только для одного и того же объекта. Если нужно обозначить другой объект, нужно использовать другую букву.
"""

